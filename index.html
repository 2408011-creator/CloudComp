<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Membership Form</title>
</head>
<body>

<div class="form-container">
    <h2>Library Membership Form</h2>
    <form action="#" method="POST">

        <!-- Fixed typo in label -->
        <div class="form-group">
            <label for="name">Member Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <!-- Fixed mismatched for and id attributes -->
        <div class="form-group">
            <label for="rollNo">Roll Number</label>
            <input type="number" id="rollNo" name="rollNo" required>
        </div>

        <!-- Fixed invalid input type -->
        <div class="form-group">
            <label for="dep">Department</label>
            <input type="text" id="dep" name="dep" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
